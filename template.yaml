AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Phishy Email Analyzer - AI-powered phishing analysis. Users forward
  suspicious emails to a designated address; SES stores them in S3 and
  triggers Lambda, which analyzes them with Claude and replies with a
  security report.

  Two manual steps remain after deploy (CloudFormation cannot do them):
  1) verify your domain in SES and add the DNS/MX records, and
  2) set the created receipt rule set as ACTIVE in the SES console
     (SES allows only one active rule set per account, so this template
     does not force it).

Parameters:
  RecipientEmail:
    Type: String
    Description: Address users forward suspicious emails to (e.g. phishy@example.com). The domain must be verified in SES with MX records pointing to SES.
  SenderEmail:
    Type: String
    Description: Verified address that analysis reports are sent from (e.g. phishy@example.com).
  ReplyToEmail:
    Type: String
    Default: ''
    Description: >
      Optional. Address that replies to Phishy's emails go to (a Reply-To
      header). Leave empty to use RecipientEmail when EmailCommandsEnabled is
      true (the command channel works by reply) and no Reply-To otherwise.
  SecurityTeamDistribution:
    Type: String
    Description: Comma-separated security-team address(es) (e.g. security@example.com). CC'd on reports, sent incident emails and fan-out alerts. Replies from these addresses count as commands (as do replies from SecurityTeamMembers).
  SecurityTeamMembers:
    Type: String
    Default: ''
    Description: >
      Optional. Comma-separated addresses of individual security-team members
      (e.g. alice@example.com) whose replies also count as commands and
      approvals, so they can act from their own mailboxes when
      SecurityTeamDistribution is a list address. They are never sent
      anything. Addresses outside SafeDomains are ignored.
  SafeDomains:
    Type: String
    Description: Comma-separated domains allowed to submit emails for analysis (e.g. example.com). Reports are only ever sent to addresses on these domains.
  AIProvider:
    Type: String
    AllowedValues: [anthropic, bedrock]
    Default: bedrock
    Description: bedrock needs no external API key; anthropic requires AnthropicApiKey.
  AnthropicApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: Required only when AIProvider is anthropic. Prefer storing this in Secrets Manager and referencing it via dynamic references for production.
  BedrockModelId:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[A-Za-z0-9._:/-]{1,200}$'
    Description: >
      Optional Bedrock model ID (an inference-profile ID) to pin this
      deployment to, for example a geography-specific profile such as
      us.anthropic.claude-opus-5-5. Leave empty to use Phishy's default.
      Used only when AIProvider is bedrock.
  DeleteEmailsAfterProcessing:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: Delete raw emails from S3 once processed.
  CampaignAlertsEnabled:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: >
      When true, Phishy broadcasts an employee warning to CampaignAlertDistribution
      once the same attack is reported by multiple people in a short window
      (>=3 reports from >=2 reporters within 4 hours, high or critical risk).
      Requires the intelligence database (IntelligenceDbSecretArn) and
      CampaignAlertDistribution, unless CampaignResponseEnabled is true.
  ReportButtonEnabled:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: >
      When true, Outlook Report-button submissions delivered to Phishy are
      handled silently: phishing reports are analyzed and only the security
      team is notified (when the verdict warrants it); junk / not-junk reports
      are skipped. The reporter is never emailed.
  CampaignAlertDistribution:
    Type: String
    Default: ''
    Description: Address the campaign broadcast is sent to (e.g. all-staff@example.com). Required when CampaignAlertsEnabled is true, unless CampaignResponseEnabled is true and its audience is recipients.
  CampaignResponseEnabled:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: >
      Campaign response: one incident email per campaign to the security team,
      a targeted warning to the people who received the email, and actions the
      security team approves by reply (mailbox removal is a dry run unless
      CampaignRemovalMode is live). Needs
      CampaignAlertsEnabled, the intelligence database with
      migrations/006_campaign_response.sql applied manually, and
      EmailCommandsEnabled for approvals to be received.
  CampaignResponseAudience:
    Type: String
    AllowedValues: [distribution, recipients, both]
    Default: distribution
    Description: >
      Who a campaign warning goes to: the distribution list, the individual
      recipients the blast-radius lookup found (needs GraphBlastRadiusEnabled),
      or both. Used only when CampaignResponseEnabled is true.
  CampaignResponseEmployeeWarning:
    Type: String
    AllowedValues: ['off', approve, auto]
    Default: approve
    Description: >
      How the targeted employee warning is authorized: approve (a security-team
      member replies with the approval line), auto (sent as soon as at least two
      people have reported the campaign) or off. Used only when
      CampaignResponseEnabled is true.
  CampaignResponseReachThreshold:
    Type: Number
    Default: 5
    MinValue: 0
    Description: >
      Open the campaign incident on the first malicious report when its
      blast-radius lookup found at least this many delivered recipients
      besides the reporters (0 = wait for the report-count threshold only).
      Automatic warnings still wait for a second reporter. Used only when
      CampaignResponseEnabled is true.
  EmailCommandsEnabled:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: >
      Email command channel: SecurityTeamDistribution and SecurityTeamMembers
      addresses whose mail passes SPF or DKIM can reply to Phishy's reports to record a verdict or
      approve a response action. Needs the intelligence database with
      migrations/002_analysis_feedback.sql applied.
  AttachmentAnalysisEnabled:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: >
      Static inspection of attachments (real type, name tricks, forms, scripts,
      macros, archive listings, links). Nothing is executed or fetched.
  SafeSenders:
    Type: String
    Default: ''
    Description: Optional. Comma-separated individual addresses allowed to submit emails for analysis, in addition to SafeDomains.
  SafeSenderSecurity:
    Type: String
    Default: ''
    Description: Optional. Comma-separated address(es) CC'd instead of SecurityTeamDistribution on reports from SafeSenders addresses.
  ProfileS3Uri:
    Type: String
    Default: ''
    Description: Optional. s3:// URI of an enterprise profile JSON. Store it under profiles/ in this stack's email bucket so the function's IAM role can read it.
  IntelligenceDbSecretArn:
    Type: String
    Default: ''
    Description: >
      Optional. ARN of a Secrets Manager secret holding the Postgres connection
      string for the threat-intelligence database (a raw connection string, or
      JSON with connectionString/url, or username/password/host fields). Leave
      empty to disable intelligence features. When set, VpcId and SubnetIds are
      required so the Lambda can reach the database privately. Note: with
      AIProvider=anthropic the VPC also needs NAT egress to reach
      api.anthropic.com - interface endpoints only cover AWS services.
  VpcId:
    Type: String
    Default: ''
    Description: VPC the intelligence database lives in. Required when IntelligenceDbSecretArn is set.
  SubnetIds:
    Type: String
    Default: ''
    Description: Comma-separated subnet IDs (two or more AZs recommended) for the Lambda's VPC config. Required when IntelligenceDbSecretArn is set.
  DatabaseSecurityGroupId:
    Type: String
    Default: ''
    Description: Optional. Security group of the Postgres instance. When set, an ingress rule allowing port 5432 from the Lambda's security group is added to it.
  CreateVpcEndpoints:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: >
      Create interface endpoints (bedrock-runtime, SES API, Secrets Manager)
      so the VPC-attached Lambda can reach AWS services without a NAT gateway
      (about USD 22/month). Set to false if the VPC already has these
      endpoints (only one private-DNS endpoint per service is allowed per
      VPC) or a NAT gateway. The VPC must also have an S3 gateway endpoint or
      NAT route - the Lambda fetches raw emails from S3. With GraphEnabled a
      Lambda endpoint is added too (about USD 7/month per subnet), so the
      function can invoke the Graph broker.
  GraphEnabled:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: >
      Optional Microsoft Graph access to your own Microsoft 365 tenant
      (read-only). When true the stack adds a second function, the Graph
      broker, outside the VPC: it holds the Graph certificate and runs the
      lookups, and the main function (which parses untrusted email) only
      invokes it. Requires GraphTenantId, GraphReadClientId and
      GraphCertificateSecretArn. On its own this changes nothing: turn on the
      features below.
  GraphTenantId:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[A-Za-z0-9.-]{1,253}$'
    Description: Directory (tenant) ID of your Microsoft 365 tenant (a GUID), or one of its verified domains. Required when GraphEnabled is true.
  GraphReadClientId:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
    Description: Application (client) ID of the read-only Entra app registration. Required when GraphEnabled is true.
  GraphCertificateSecretArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws[a-z-]*:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+$'
    Description: >
      ARN of the Secrets Manager secret holding the read app's private key and
      certificate (see docs/CONFIGURATION.md). Only the Graph broker's role can
      read it. Required when GraphEnabled is true.
  GraphOriginalFetchEnabled:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: Read a forwarded email's real headers from the reporter's own mailbox before analysis. Needs GraphEnabled.
  GraphBlastRadiusEnabled:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: After a malicious verdict, tell the security team who else received the message. Needs GraphEnabled.
  GraphSenderHistoryEnabled:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: Before analysis, check the claimed sender's history with the organization in message trace. Needs GraphEnabled.
  GraphFanoutScanEnabled:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: >
      Scheduled fan-out scan: every GraphFanoutScanIntervalMinutes, read recent
      inbound mail flow (message trace) and email the security team when an
      established external contact suddenly sends one subject to many internal
      people (with CampaignResponseEnabled, an incident email instead).
      Read-only; no AI model. Needs GraphEnabled and the intelligence database
      (IntelligenceDbSecretArn) with migrations/005_fanout_scan.sql applied
      manually.
  GraphFanoutScanIntervalMinutes:
    Type: Number
    Default: 5
    MinValue: 2
    MaxValue: 60
    Description: >
      Minutes between fan-out scans. All scans together spend at most 20
      message-trace requests per 5 minutes (tracked in the database), so a
      shorter interval means smaller scans, not more requests. Used only when
      GraphFanoutScanEnabled is true.
  GraphBrokerReservedConcurrency:
    Type: Number
    Default: 5
    MinValue: 0
    MaxValue: 100
    Description: >
      Most Graph broker instances that can run at once. Each instance keeps its
      own request allowance toward your tenant's message-trace limit, so this
      bounds what Phishy can ask of Microsoft during a flood of reports;
      lookups beyond it are skipped and analysis proceeds without them. Set to
      0 to reserve nothing (required if the account's concurrency quota is too
      small to reserve from). Used only when GraphEnabled is true.
  # The mailbox write tier (optional; nothing below is created unless both
  # GraphWriteClientId and GraphWriteCertificateSecretArn are supplied)
  GraphWriteClientId:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
    Description: >
      Optional. Application (client) ID of a SEPARATE Entra app registration
      for the mailbox write tier (Mail.ReadWrite, application, certificate
      only), never the read app's. With GraphWriteCertificateSecretArn it
      deploys a third function, the Graph write broker, which only the
      campaign-response removal uses. Leave empty to deploy no write tier.
  GraphWriteCertificateSecretArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws[a-z-]*:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+$'
    Description: >
      Optional. ARN of the Secrets Manager secret holding the WRITE app's
      private key and certificate (a different secret from
      GraphCertificateSecretArn). Only the write broker's role can read it.
  GraphWriteEnabled:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: >
      The write broker's own kill switch. While false (the default) it refuses
      every request, even when the main function is set to live removal. Used
      only when the write broker is deployed.
  GraphWriteAllowedMailboxIds:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}(,[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})*$'
    Description: >
      Optional. Comma-separated Entra object IDs of the only mailboxes the
      write broker may change (for example a single test mailbox in staging);
      any other mailbox is refused. Empty: no allowlist.
  GraphWriteBrokerReservedConcurrency:
    Type: Number
    Default: 2
    MinValue: 0
    MaxValue: 10
    Description: >
      Most write broker instances that can run at once (0 reserves nothing).
      Used only when the write broker is deployed.
  CampaignRemovalMode:
    Type: String
    AllowedValues: [dry_run, live]
    Default: dry_run
    Description: >
      How an approved campaign removal is carried out: dry_run (reported, no
      mailbox changed) or live (the write broker moves the approved copies to
      Deleted Items). live needs CampaignResponseEnabled and the write broker;
      the write broker's GraphWriteEnabled must also be true for anything to
      move. A removal always needs the exact APPROVE REMOVAL reply.

Rules:
  GraphSettingsPresent:
    RuleCondition: !Equals [!Ref GraphEnabled, 'true']
    Assertions:
      - Assert: !Not [!Equals [!Ref GraphTenantId, '']]
        AssertDescription: GraphTenantId is required when GraphEnabled is true
      - Assert: !Not [!Equals [!Ref GraphReadClientId, '']]
        AssertDescription: GraphReadClientId is required when GraphEnabled is true
      - Assert: !Not [!Equals [!Ref GraphCertificateSecretArn, '']]
        AssertDescription: GraphCertificateSecretArn is required when GraphEnabled is true
  CampaignResponseRequirements:
    RuleCondition: !Equals [!Ref CampaignResponseEnabled, 'true']
    Assertions:
      - Assert: !Equals [!Ref CampaignAlertsEnabled, 'true']
        AssertDescription: CampaignResponseEnabled needs CampaignAlertsEnabled=true
      - Assert: !Not [!Equals [!Ref IntelligenceDbSecretArn, '']]
        AssertDescription: CampaignResponseEnabled needs the intelligence database (IntelligenceDbSecretArn)
  FanoutScanRequirements:
    RuleCondition: !Equals [!Ref GraphFanoutScanEnabled, 'true']
    Assertions:
      - Assert: !Equals [!Ref GraphEnabled, 'true']
        AssertDescription: GraphFanoutScanEnabled needs GraphEnabled=true
      - Assert: !Not [!Equals [!Ref IntelligenceDbSecretArn, '']]
        AssertDescription: GraphFanoutScanEnabled needs the intelligence database (IntelligenceDbSecretArn) for its state
  GraphWriteSettingsPresent:
    RuleCondition: !Or
      - !Not [!Equals [!Ref GraphWriteClientId, '']]
      - !Not [!Equals [!Ref GraphWriteCertificateSecretArn, '']]
    Assertions:
      - Assert: !Not [!Equals [!Ref GraphWriteClientId, '']]
        AssertDescription: GraphWriteClientId is required with GraphWriteCertificateSecretArn
      - Assert: !Not [!Equals [!Ref GraphWriteCertificateSecretArn, '']]
        AssertDescription: GraphWriteCertificateSecretArn is required with GraphWriteClientId
      - Assert: !Not [!Equals [!Ref GraphTenantId, '']]
        AssertDescription: GraphTenantId is required for the write broker
      - Assert: !Not [!Equals [!Ref GraphWriteClientId, !Ref GraphReadClientId]]
        AssertDescription: The write app registration must be a different app from the read one
      - Assert: !Not [!Equals [!Ref GraphWriteCertificateSecretArn, !Ref GraphCertificateSecretArn]]
        AssertDescription: The write certificate must be a different secret from the read one
  LiveRemovalRequirements:
    RuleCondition: !Equals [!Ref CampaignRemovalMode, live]
    Assertions:
      - Assert: !Equals [!Ref CampaignResponseEnabled, 'true']
        AssertDescription: CampaignRemovalMode=live needs CampaignResponseEnabled=true
      - Assert: !Not [!Equals [!Ref GraphWriteClientId, '']]
        AssertDescription: CampaignRemovalMode=live needs the write broker (GraphWriteClientId, GraphWriteCertificateSecretArn)

Conditions:
  UseAnthropic: !Equals [!Ref AIProvider, anthropic]
  UseBedrock: !Equals [!Ref AIProvider, bedrock]
  UseIntelligence: !Not [!Equals [!Ref IntelligenceDbSecretArn, '']]
  CreateEndpoints: !And
    - !Condition UseIntelligence
    - !Equals [!Ref CreateVpcEndpoints, 'true']
  CreateBedrockEndpoint: !And
    - !Condition CreateEndpoints
    - !Condition UseBedrock
  HasDatabaseSg: !And
    - !Condition UseIntelligence
    - !Not [!Equals [!Ref DatabaseSecurityGroupId, '']]
  HasBedrockModel: !And
    - !Condition UseBedrock
    - !Not [!Equals [!Ref BedrockModelId, '']]
  HasSafeSenders: !Not [!Equals [!Ref SafeSenders, '']]
  HasSafeSenderSecurity: !Not [!Equals [!Ref SafeSenderSecurity, '']]
  HasSecurityTeamMembers: !Not [!Equals [!Ref SecurityTeamMembers, '']]
  HasProfile: !Not [!Equals [!Ref ProfileS3Uri, '']]
  HasCampaignAlertDistribution: !Not [!Equals [!Ref CampaignAlertDistribution, '']]
  UseCampaignResponse: !And
    - !Condition UseIntelligence
    - !Equals [!Ref CampaignAlertsEnabled, 'true']
    - !Equals [!Ref CampaignResponseEnabled, 'true']
  # Campaign alerts need somewhere to send the broadcast, unless campaign
  # response is on (it can warn the individual recipients instead)
  UseCampaignAlerts: !And
    - !Condition UseIntelligence
    - !Equals [!Ref CampaignAlertsEnabled, 'true']
    - !Or
      - !Condition HasCampaignAlertDistribution
      - !Equals [!Ref CampaignResponseEnabled, 'true']
  UseCampaignAlertDistribution: !And
    - !Condition UseCampaignAlerts
    - !Condition HasCampaignAlertDistribution
  UseEmailCommands: !And
    - !Condition UseIntelligence
    - !Equals [!Ref EmailCommandsEnabled, 'true']
  HasReplyToEmail: !Not [!Equals [!Ref ReplyToEmail, '']]
  UseAttachmentAnalysis: !Equals [!Ref AttachmentAnalysisEnabled, 'true']
  UseReportButton: !Equals [!Ref ReportButtonEnabled, 'true']
  # The GraphSettingsPresent rule rejects GraphEnabled without the secret ARN,
  # so the second clause never decides anything at deploy time; it states the
  # same dependency where the resources that use the ARN are conditioned.
  UseGraph: !And
    - !Equals [!Ref GraphEnabled, 'true']
    - !Not [!Equals [!Ref GraphCertificateSecretArn, '']]
  UseGraphOriginalFetch: !And
    - !Condition UseGraph
    - !Equals [!Ref GraphOriginalFetchEnabled, 'true']
  UseGraphBlastRadius: !And
    - !Condition UseGraph
    - !Equals [!Ref GraphBlastRadiusEnabled, 'true']
  UseGraphSenderHistory: !And
    - !Condition UseGraph
    - !Equals [!Ref GraphSenderHistoryEnabled, 'true']
  # The scan keeps its lock, window and dedupe state in the intelligence
  # database, so it is deployed only with one (the rule above says so)
  UseGraphFanoutScan: !And
    - !Condition UseGraph
    - !Condition UseIntelligence
    - !Equals [!Ref GraphFanoutScanEnabled, 'true']
  ReserveGraphBrokerConcurrency: !And
    - !Condition UseGraph
    - !Not [!Equals [!Ref GraphBrokerReservedConcurrency, 0]]
  # The write tier: deployed only when its own app registration and secret
  # are supplied. The rule above rejects one without the other.
  UseGraphWrite: !And
    - !Not [!Equals [!Ref GraphWriteClientId, '']]
    - !Not [!Equals [!Ref GraphWriteCertificateSecretArn, '']]
  HasGraphWriteAllowlist: !And
    - !Condition UseGraphWrite
    - !Not [!Equals [!Ref GraphWriteAllowedMailboxIds, '']]
  ReserveGraphWriteBrokerConcurrency: !And
    - !Condition UseGraphWrite
    - !Not [!Equals [!Ref GraphWriteBrokerReservedConcurrency, 0]]
  # Only then is the main function told to use it, and allowed to invoke it
  UseLiveRemoval: !And
    - !Condition UseGraphWrite
    - !Condition UseCampaignResponse
    - !Equals [!Ref CampaignRemovalMode, live]
  CreateLambdaEndpoint: !And
    - !Condition CreateEndpoints
    - !Or
      - !Condition UseGraph
      - !Condition UseLiveRemoval

Resources:
  EmailBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-emails-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireRawEmails
            Status: Enabled
            Prefix: emails/
            ExpirationInDays: 90

  EmailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref EmailBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowSESPuts
            Effect: Allow
            Principal:
              Service: ses.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${EmailBucket.Arn}/emails/*'
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  PhishyFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        EntryPoints:
          - src/index.ts
        External:
          - '@aws-sdk/*'
        Loader:
          - .pem=text
    Properties:
      Handler: index.handler
      Runtime: nodejs22.x
      Architectures: [x86_64]
      MemorySize: 1024
      # 180s accommodates the Bedrock analysis retry budget (~15s/30s/60s backoff
      # over 4 attempts ≈ 105s of waiting) so a transient provider blip is ridden
      # out within a single invocation rather than returning an "analysis
      # unavailable" report.
      # Keep in sync with ANALYSIS_* retry constants in bedrock.provider.ts.
      Timeout: 180
      Environment:
        Variables:
          PHISHY_AI_PROVIDER: !Ref AIProvider
          ANTHROPIC_API_KEY: !If [UseAnthropic, !Ref AnthropicApiKey, !Ref AWS::NoValue]
          PHISHY_BEDROCK_REGION: !If [UseBedrock, !Ref AWS::Region, !Ref AWS::NoValue]
          PHISHY_BEDROCK_MODEL: !If [HasBedrockModel, !Ref BedrockModelId, !Ref AWS::NoValue]
          S3_BUCKET_NAME: !Ref EmailBucket
          SENDER_EMAIL: !Ref SenderEmail
          # Replies must reach Phishy for the command channel to work
          REPLY_TO_EMAIL: !If
            - HasReplyToEmail
            - !Ref ReplyToEmail
            - !If [UseEmailCommands, !Ref RecipientEmail, !Ref AWS::NoValue]
          SECURITY_TEAM_DISTRIBUTION: !Ref SecurityTeamDistribution
          SECURITY_TEAM_MEMBERS: !If [HasSecurityTeamMembers, !Ref SecurityTeamMembers, !Ref AWS::NoValue]
          SAFE_DOMAINS: !Ref SafeDomains
          PHISHY_AWS_REGION: !Ref AWS::Region
          DELETE_EMAILS_AFTER_PROCESSING: !Ref DeleteEmailsAfterProcessing
          SAFE_SENDERS: !If [HasSafeSenders, !Ref SafeSenders, !Ref AWS::NoValue]
          SAFE_SENDER_SECURITY: !If [HasSafeSenderSecurity, !Ref SafeSenderSecurity, !Ref AWS::NoValue]
          PHISHY_PROFILE: !If [HasProfile, !Ref ProfileS3Uri, !Ref AWS::NoValue]
          PHISHY_INTELLIGENCE_ENABLED: !If [UseIntelligence, 'true', !Ref AWS::NoValue]
          PHISHY_DB_CONNECTION: !If [UseIntelligence, !Ref IntelligenceDbSecretArn, !Ref AWS::NoValue]
          PHISHY_CAMPAIGN_ALERTS_ENABLED: !If [UseCampaignAlerts, 'true', !Ref AWS::NoValue]
          PHISHY_CAMPAIGN_ALERTS_DISTRIBUTION: !If [UseCampaignAlertDistribution, !Ref CampaignAlertDistribution, !Ref AWS::NoValue]
          PHISHY_CAMPAIGN_RESPONSE_ENABLED: !If [UseCampaignResponse, 'true', !Ref AWS::NoValue]
          PHISHY_CAMPAIGN_RESPONSE_AUDIENCE: !If [UseCampaignResponse, !Ref CampaignResponseAudience, !Ref AWS::NoValue]
          PHISHY_CAMPAIGN_RESPONSE_EMPLOYEE_WARNING: !If [UseCampaignResponse, !Ref CampaignResponseEmployeeWarning, !Ref AWS::NoValue]
          PHISHY_CAMPAIGN_RESPONSE_REACH_THRESHOLD: !If [UseCampaignResponse, !Ref CampaignResponseReachThreshold, !Ref AWS::NoValue]
          PHISHY_EMAIL_COMMANDS_ENABLED: !If [UseEmailCommands, 'true', !Ref AWS::NoValue]
          PHISHY_ATTACHMENT_ANALYSIS_ENABLED: !If [UseAttachmentAnalysis, 'true', !Ref AWS::NoValue]
          PHISHY_REPORT_BUTTON_ENABLED: !If [UseReportButton, 'true', !Ref AWS::NoValue]
          # Graph: this function only invokes the broker. It is given no
          # tenant ID, client ID or certificate, and no access to the secret.
          PHISHY_GRAPH_ENABLED: !If [UseGraph, 'true', !Ref AWS::NoValue]
          PHISHY_GRAPH_MODE: !If [UseGraph, broker, !Ref AWS::NoValue]
          PHISHY_GRAPH_BROKER_FUNCTION: !If [UseGraph, !Ref GraphBrokerFunction, !Ref AWS::NoValue]
          PHISHY_GRAPH_ORIGINAL_FETCH_ENABLED: !If [UseGraphOriginalFetch, 'true', !Ref AWS::NoValue]
          PHISHY_GRAPH_BLAST_RADIUS_ENABLED: !If [UseGraphBlastRadius, 'true', !Ref AWS::NoValue]
          PHISHY_GRAPH_SENDER_HISTORY_ENABLED: !If [UseGraphSenderHistory, 'true', !Ref AWS::NoValue]
          PHISHY_GRAPH_FANOUT_SCAN_ENABLED: !If [UseGraphFanoutScan, 'true', !Ref AWS::NoValue]
          # Live removal: this function only invokes the write broker. It is
          # given no write client ID, no write secret and no access to it.
          PHISHY_CAMPAIGN_RESPONSE_REMOVAL_MODE: !If [UseLiveRemoval, live, !Ref AWS::NoValue]
          PHISHY_GRAPH_WRITE_BROKER_FUNCTION: !If [UseLiveRemoval, !Ref GraphWriteBrokerFunction, !Ref AWS::NoValue]
      VpcConfig: !If
        - UseIntelligence
        - SecurityGroupIds:
            - !Ref LambdaSecurityGroup
          SubnetIds: !Split [',', !Ref SubnetIds]
        - !Ref AWS::NoValue
      Policies:
        - Statement:
            - Sid: SendReports
              Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: '*'
            - Sid: ReadStoredEmails
              Effect: Allow
              Action:
                - s3:GetObject
                - s3:DeleteObject
              Resource: !Sub '${EmailBucket.Arn}/emails/*'
            - Sid: ReadProfile
              Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub '${EmailBucket.Arn}/profiles/*'
        - !If
          - UseBedrock
          - Statement:
              - Sid: InvokeBedrock
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - !Sub 'arn:aws:bedrock:*::foundation-model/anthropic.claude-*'
                  - !Sub 'arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*'
          - !Ref AWS::NoValue
        - !If
          - UseIntelligence
          - Statement:
              - Sid: ReadDbCredentials
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref IntelligenceDbSecretArn
          - !Ref AWS::NoValue
        - !If
          - UseGraph
          - Statement:
              - Sid: InvokeGraphBroker
                Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt GraphBrokerFunction.Arn
          - !Ref AWS::NoValue
        - !If
          - UseLiveRemoval
          - Statement:
              - Sid: InvokeGraphWriteBroker
                Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt GraphWriteBrokerFunction.Arn
          - !Ref AWS::NoValue

  # The Graph broker: the only function that talks to Microsoft Graph and the
  # only one that can read the Graph certificate. It is deliberately NOT
  # attached to the VPC (it needs the internet route the main function must
  # not have) and has no trigger: no function URL, API or event source. The
  # main function invokes it directly with a request for one of four typed
  # operations (original_message_lookup, sender_history_lookup,
  # blast_radius_lookup, fanout_scan); see docs/ARCHITECTURE.md, "Graph broker".
  GraphBrokerFunction:
    Type: AWS::Serverless::Function
    Condition: UseGraph
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        EntryPoints:
          - src/graph-broker.ts
        External:
          - '@aws-sdk/*'
    Properties:
      Handler: graph-broker.handler
      Runtime: nodejs22.x
      Architectures: [x86_64]
      # It holds a few hundred mailbox-lookup results at most
      MemorySize: 512
      # The blast-radius lookup may run for its whole time budget (up to 150s)
      # and keeps 20s of the function's remaining time in reserve, so 180s
      # covers every allowed budget. The main function stops waiting at its
      # own budget regardless.
      Timeout: 180
      # A ceiling on concurrent Graph work: every instance has its own
      # allowance toward the tenant's message-trace limit. Throttled
      # invocations fail open in the main function.
      ReservedConcurrentExecutions: !If
        - ReserveGraphBrokerConcurrency
        - !Ref GraphBrokerReservedConcurrency
        - !Ref AWS::NoValue
      Role: !GetAtt GraphBrokerRole.Arn
      LoggingConfig:
        LogGroup: !Ref GraphBrokerLogGroup
      Environment:
        Variables:
          PHISHY_GRAPH_ENABLED: 'true'
          PHISHY_GRAPH_TENANT_ID: !Ref GraphTenantId
          PHISHY_GRAPH_READ_CLIENT_ID: !Ref GraphReadClientId
          # The ARN, not the certificate: fetched on the first Graph call
          PHISHY_GRAPH_READ_CERTIFICATE: !Ref GraphCertificateSecretArn
          # The broker refuses an operation whose feature is off here
          PHISHY_GRAPH_ORIGINAL_FETCH_ENABLED: !Ref GraphOriginalFetchEnabled
          PHISHY_GRAPH_BLAST_RADIUS_ENABLED: !Ref GraphBlastRadiusEnabled
          PHISHY_GRAPH_SENDER_HISTORY_ENABLED: !Ref GraphSenderHistoryEnabled
          # Set only when the scan is deployed, so turning it off changes nothing here
          PHISHY_GRAPH_FANOUT_SCAN_ENABLED: !If [UseGraphFanoutScan, 'true', !Ref AWS::NoValue]

  GraphBrokerLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: UseGraph
    Properties:
      RetentionInDays: 90

  # Least privilege, stated in full: write to its own log group and read the
  # one certificate secret. No S3, SES, Bedrock, database secret or VPC
  # access, and nothing that writes to anything but its log.
  GraphBrokerRole:
    Type: AWS::IAM::Role
    Condition: UseGraph
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: graph-broker
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteOwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt GraphBrokerLogGroup.Arn
              - Sid: ReadGraphCertificate
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref GraphCertificateSecretArn

  # The Graph write broker (the mailbox write tier): the only function that
  # can change a mailbox, and the only one that can read the WRITE
  # certificate. Deployed only with GraphWriteClientId and
  # GraphWriteCertificateSecretArn. Outside the VPC, no trigger (no function
  # URL, API or event source); the main function invokes it directly, and
  # only when CampaignRemovalMode is live. One operation, remove_messages:
  # move approved copies to Deleted Items. Its own kill switch
  # (GraphWriteEnabled, default false) and allowlist are in its own
  # environment. See docs/ARCHITECTURE.md, "The mailbox write tier".
  GraphWriteBrokerFunction:
    Type: AWS::Serverless::Function
    Condition: UseGraphWrite
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        EntryPoints:
          - src/graph-write-broker.ts
        External:
          - '@aws-sdk/*'
    Properties:
      Handler: graph-write-broker.handler
      Runtime: nodejs22.x
      Architectures: [x86_64]
      MemorySize: 256
      # One call works for at most 80s (the protocol's budget bound); the
      # main function stops waiting a few seconds after that
      Timeout: 100
      ReservedConcurrentExecutions: !If
        - ReserveGraphWriteBrokerConcurrency
        - !Ref GraphWriteBrokerReservedConcurrency
        - !Ref AWS::NoValue
      Role: !GetAtt GraphWriteBrokerRole.Arn
      LoggingConfig:
        LogGroup: !Ref GraphWriteBrokerLogGroup
      Environment:
        Variables:
          PHISHY_GRAPH_WRITE_ENABLED: !Ref GraphWriteEnabled
          PHISHY_GRAPH_TENANT_ID: !Ref GraphTenantId
          PHISHY_GRAPH_WRITE_CLIENT_ID: !Ref GraphWriteClientId
          # The ARN, not the certificate: fetched on the first request
          PHISHY_GRAPH_WRITE_CERTIFICATE: !Ref GraphWriteCertificateSecretArn
          PHISHY_GRAPH_WRITE_ALLOWED_MAILBOX_IDS: !If [HasGraphWriteAllowlist, !Ref GraphWriteAllowedMailboxIds, !Ref AWS::NoValue]

  GraphWriteBrokerLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: UseGraphWrite
    Properties:
      RetentionInDays: 365

  # Least privilege, stated in full: write to its own log group and read the
  # one WRITE certificate secret. Not the read secret, not the database
  # secret, no S3, SES, Bedrock, Lambda or VPC access.
  GraphWriteBrokerRole:
    Type: AWS::IAM::Role
    Condition: UseGraphWrite
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: graph-write-broker
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteOwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt GraphWriteBrokerLogGroup.Arn
              - Sid: ReadGraphWriteCertificate
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref GraphWriteCertificateSecretArn

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: UseIntelligence
    Properties:
      GroupDescription: Phishy Lambda egress
      VpcId: !Ref VpcId

  # Lets the Lambda reach the intelligence database without opening the
  # database to anything else.
  DatabaseIngressFromLambda:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasDatabaseSg
    Properties:
      GroupId: !Ref DatabaseSecurityGroupId
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !GetAtt LambdaSecurityGroup.GroupId
      Description: Phishy Lambda to Postgres

  EndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: CreateEndpoints
    Properties:
      GroupDescription: HTTPS from Phishy Lambda to VPC interface endpoints
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !GetAtt LambdaSecurityGroup.GroupId

  # A VPC-attached Lambda has no internet access, so every AWS service the
  # code calls needs a private path: these interface endpoints for Bedrock,
  # the SES API, and Secrets Manager, plus an S3 gateway endpoint (or NAT)
  # the VPC must already provide. CloudWatch metrics need nothing - they are
  # emitted as EMF log lines through the Lambda log pipeline.
  BedrockRuntimeEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateBedrockEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.bedrock-runtime'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: !Split [',', !Ref SubnetIds]
      SecurityGroupIds:
        - !Ref EndpointSecurityGroup

  SesApiEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateEndpoints
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.email'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: !Split [',', !Ref SubnetIds]
      SecurityGroupIds:
        - !Ref EndpointSecurityGroup

  SecretsManagerEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateEndpoints
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.secretsmanager'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: !Split [',', !Ref SubnetIds]
      SecurityGroupIds:
        - !Ref EndpointSecurityGroup

  # Lets the VPC-attached main function invoke the Graph broker (the Lambda
  # API) without internet access. The broker itself is outside the VPC.
  LambdaEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateLambdaEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.lambda'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: !Split [',', !Ref SubnetIds]
      SecurityGroupIds:
        - !Ref EndpointSecurityGroup

  # The fan-out scan's schedule: invokes the MAIN function (which owns email
  # and the database) with Phishy's own constant payload. The function
  # refuses any other payload that claims to be a scheduled task. Only
  # created with GraphFanoutScanEnabled=true, Graph and the database.
  FanoutScanSchedule:
    Type: AWS::Events::Rule
    Condition: UseGraphFanoutScan
    Properties:
      Description: Phishy scheduled fan-out scan (read-only message trace; no AI model)
      ScheduleExpression: !Sub 'rate(${GraphFanoutScanIntervalMinutes} minutes)'
      State: ENABLED
      Targets:
        - Id: phishy-fanout-scan
          Arn: !GetAtt PhishyFunction.Arn
          Input: '{"phishyScheduledTask":"graph_fanout_scan","version":1}'
          RetryPolicy:
            # A scan that did not run is simply the next one's window
            MaximumRetryAttempts: 0
            MaximumEventAgeInSeconds: 60

  FanoutScanInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: UseGraphFanoutScan
    Properties:
      FunctionName: !Ref PhishyFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt FanoutScanSchedule.Arn

  SESInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PhishyFunction
      Action: lambda:InvokeFunction
      Principal: ses.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  ReceiptRuleSet:
    Type: AWS::SES::ReceiptRuleSet
    Properties:
      RuleSetName: !Sub '${AWS::StackName}-rules'

  # S3 action MUST come before the Lambda action: SES stores the full raw
  # email first, then the Lambda fetches it from S3 (the SES event itself
  # carries only headers/metadata).
  ReceiptRule:
    Type: AWS::SES::ReceiptRule
    DependsOn:
      - EmailBucketPolicy
      - SESInvokePermission
    Properties:
      RuleSetName: !Ref ReceiptRuleSet
      Rule:
        Name: phishy-analyze
        Enabled: true
        ScanEnabled: true
        Recipients:
          - !Ref RecipientEmail
        Actions:
          - S3Action:
              BucketName: !Ref EmailBucket
              ObjectKeyPrefix: emails/
          - LambdaAction:
              FunctionArn: !GetAtt PhishyFunction.Arn
              InvocationType: Event

Outputs:
  FunctionArn:
    Description: Phishy Lambda function ARN
    Value: !GetAtt PhishyFunction.Arn
  GraphBrokerFunctionArn:
    Condition: UseGraph
    Description: Graph broker function ARN (invoked only by the Phishy function)
    Value: !GetAtt GraphBrokerFunction.Arn
  GraphWriteBrokerFunctionArn:
    Condition: UseGraphWrite
    Description: Graph write broker function ARN (the mailbox write tier; invoked only by the Phishy function in live removal mode)
    Value: !GetAtt GraphWriteBrokerFunction.Arn
  EmailBucketName:
    Description: Bucket where SES stores raw emails
    Value: !Ref EmailBucket
  ReceiptRuleSetName:
    Description: Rule set to activate in the SES console (Email receiving -> Rule sets -> Set as active)
    Value: !Ref ReceiptRuleSet
  NextSteps:
    Description: Remaining manual steps
    Value: !Sub 'Verify the domain of ${RecipientEmail} in SES (DNS + MX records), then set rule set "${ReceiptRuleSet}" as active. In SES sandbox mode, also verify recipient addresses.'
